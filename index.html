<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hablemos — app de comunicación</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3A6FD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#F6F4EF;--card:#FFFFFF;--ink:#2B2D42;--muted:#6B6F80;--line:#E6E1D6;
  --brand:#3A6FD8;--ok:#2E9E6A;--warn:#E08A2E;
  --c-per:#FFE08A;--c-acc:#A6E3AE;--c-cos:#FFC891;--c-lug:#D7C0F2;--c-cua:#A6CDF6;--c-com:#AEE6E3;--c-uni:#F7BCD5;--c-pre:#E3E3E8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;font-size:inherit}
.app{max-width:920px;margin:0 auto;padding:12px 14px 48px;min-height:100vh}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:46px;height:46px;border-radius:14px;background:var(--card);font-size:22px;box-shadow:0 2px 0 var(--line);flex:none}
h1{font-size:22px;margin:0;flex:1;font-weight:900;line-height:1.15}
.stars{background:var(--card);padding:9px 13px;border-radius:999px;font-weight:900;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.sub{color:var(--muted);font-weight:700;margin:0 0 14px}
.chip{display:inline-block;background:#EAF0FC;color:var(--brand);padding:5px 11px;border-radius:999px;font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.act{background:var(--card);border-radius:22px;padding:18px 16px;text-align:left;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:6px;min-height:150px}
.act .em{font-size:44px;line-height:1}
.act b{font-size:19px;font-weight:900}
.act span{color:var(--muted);font-weight:700;font-size:14px;line-height:1.3}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 3px 0 var(--line);margin-bottom:12px}
.big{font-size:22px;font-weight:800;line-height:1.35}
.btn{background:var(--brand);color:#fff;border-radius:16px;padding:14px 18px;font-weight:900;font-size:18px;box-shadow:0 3px 0 #2A55AE}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #217750}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:active,.opt:active,.tile:active,.act:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;text-align:left;min-height:64px}
.opt .e{font-size:30px;flex:none}
/* Comunicador */
.bar{background:var(--card);border-radius:20px;padding:10px;box-shadow:0 3px 0 var(--line);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:62px;align-items:center}
.pchip{border-radius:12px;padding:6px 9px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:5px}
.pchip .e{font-size:22px}
.placeholder{color:var(--muted);font-weight:700;padding:0 6px}
.meter{height:12px;background:#EEE9DD;border-radius:99px;overflow:hidden;flex:1;min-width:90px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.tab{padding:10px 14px;border-radius:14px;font-weight:900;white-space:nowrap;border:3px solid transparent;font-size:16px}
.tab.on{border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}
.tile{border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:16px;min-height:96px;justify-content:center;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.tile .e{font-size:36px;line-height:1}
/* Expand */
.hero{font-size:84px;text-align:center;line-height:1.1}
.seg{border-radius:10px;padding:2px 6px;margin:2px 0;display:inline}
.q{font-size:24px;font-weight:900;margin:6px 0 10px}
/* Story */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.slot{border:3px dashed #CFC8B8;border-radius:18px;min-height:150px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:#FBFAF6}
.slot.full{border-style:solid;border-color:var(--ok);background:#F0FAF4}
.slot .lbl{font-weight:900;color:var(--brand);font-size:16px}
.slot .e{font-size:48px}
.slot .t{font-weight:700;font-size:15px}
.scard{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:15px}
.scard .e{font-size:48px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* Talk */
.bubble{border-radius:22px;padding:14px 16px;font-size:21px;font-weight:800;line-height:1.35;max-width:92%;margin-bottom:10px}
.bubble.bot{background:#EAF0FC;border-bottom-left-radius:6px}
.bubble.me{background:#E3F5EA;margin-left:auto;border-bottom-right-radius:6px}
.who{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:2px}
.starter{display:inline-block;background:var(--c-per);border-radius:10px;padding:2px 8px;margin-right:6px}
/* Modal + toast */
.overlay{position:fixed;inset:0;background:rgba(30,32,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.field{margin-bottom:14px}
.field label{display:block;font-weight:900;margin-bottom:6px}
.field input[type=text],.field select{width:100%;font:inherit;color:#2B2D42;-webkit-text-fill-color:#2B2D42;font-weight:700;font-size:18px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff}
.field input[type=range]{width:100%}
.field input::placeholder{color:#9A9DAA;-webkit-text-fill-color:#9A9DAA}
select option{color:#2B2D42;background:#fff}
.hint{color:var(--muted);font-size:14px;font-weight:700;margin-top:4px;line-height:1.35}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#fff;border-radius:26px;padding:20px 26px;font-size:26px;font-weight:900;box-shadow:0 10px 40px rgba(0,0,0,.18);z-index:30;text-align:center;pointer-events:none}
.toast .e{font-size:58px;display:block}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.wchip{padding:4px 9px;border-radius:10px;font-weight:800;font-size:18px;display:inline-block}
.wchip.hit{background:#CFEFDC;color:#1E6B47}
.wchip.miss{background:#fff;border:2px dashed #C9C2B2;color:#8A8676}
.btn.mic{background:#E2574C;box-shadow:0 3px 0 #A93A31;width:100%;font-size:21px;padding:17px;margin:6px 0 10px}
.btn.mic.on{background:#2E9E6A;box-shadow:0 3px 0 #217750;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.micmsg{font-size:20px;font-weight:900;margin:10px 0 4px}
.noanim *{animation:none!important;transition:none!important}
.foot{color:var(--muted);font-size:13px;font-weight:700;text-align:center;margin-top:22px;line-height:1.4}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.age{background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px 0;font-weight:900;font-size:20px}
.age.on{border-color:var(--brand);background:#EAF0FC}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
/* ============ DATOS ============ */
const LEVELS=[
  {name:'Inicial',   desc:'Frases de 2 palabras', target:2, exp:0, scenes:2, follows:0, askBack:false},
  {name:'Básico',    desc:'Frases de 3 palabras', target:3, exp:1, scenes:3, follows:0, askBack:false},
  {name:'Intermedio',desc:'Frases de 5 palabras con "y"', target:5, exp:2, scenes:3, follows:1, askBack:true},
  {name:'Avanzado',  desc:'Frases largas con "porque", "después"', target:7, exp:3, scenes:4, follows:2, askBack:true},
];
const levelFromAge=a=>a<=4?0:a<=6?1:a<=9?2:3;

const CATS=[
 {id:'per',name:'Personas',color:'var(--c-per)',w:[['yo','🙋'],['tú','👉'],['mamá','👩'],['papá','👨'],['mi hermano','👦'],['mi hermana','👧'],['mi amigo','🧒'],['la tía','👩‍🏫'],['el perro','🐶'],['el gato','🐱']]},
 {id:'acc',name:'Acciones',color:'var(--c-acc)',w:[['quiero','🤲'],['me gusta','👍'],['no me gusta','👎'],['necesito','🙏'],['voy a','➡️'],['estoy','🧍'],['tengo','✋'],['puedo','💪'],['comer','🍽️'],['jugar','🎲'],['ir','🚶'],['ver','👀'],['dormir','😴'],['tomar','🥤'],['dibujar','✏️'],['ayudar','🤝'],['salir','🚪'],['escuchar','👂']]},
 {id:'cos',name:'Cosas',color:'var(--c-cos)',w:[['agua','💧'],['jugo','🧃'],['galletas','🍪'],['pan','🍞'],['fruta','🍎'],['la pelota','⚽'],['mis juguetes','🧸'],['la tablet','📱'],['la tele','📺'],['un libro','📖'],['música','🎵'],['legos','🧱'],['un abrazo','🤗']]},
 {id:'lug',name:'Lugares',color:'var(--c-lug)',w:[['en la casa','🏠'],['al colegio','🏫'],['a la plaza','🛝'],['al baño','🚽'],['afuera','🌳'],['a mi pieza','🛏️'],['a la playa','🏖️'],['al súper','🛒']]},
 {id:'cua',name:'Cuándo',color:'var(--c-cua)',w:[['ahora','⏰'],['después','⏳'],['hoy','🗓️'],['mañana','🌅'],['en la noche','🌙'],['en el recreo','🔔'],['el fin de semana','🎉']]},
 {id:'com',name:'Cómo es',color:'var(--c-com)',w:[['feliz','😄'],['triste','😢'],['enojado','😠'],['cansado','🥱'],['con hambre','😋'],['con miedo','😨'],['tranquilo','😌'],['rico','🤤'],['grande','🐘'],['chico','🐭'],['divertido','🤩']]},
 {id:'uni',name:'Unir',color:'var(--c-uni)',w:[['y','➕'],['porque','💬'],['pero','↔️'],['con','🤝'],['también','✨'],['no','🚫'],['muy','‼️'],['por favor','🙏'],['gracias','💛']]},
 {id:'pre',name:'Preguntas',color:'var(--c-pre)',w:[['¿qué?','❓'],['¿dónde?','📍'],['¿cuándo?','🕐'],['¿quién?','🧑'],['¿por qué?','🤔'],['¿puedo?','🙋'],['¿y tú?','👉']]},
];

const EXP=[
 {e:'🐶',base:'El perro corre',
  donde:[['en el parque','🌳'],['en la playa','🏖️'],['en la casa','🏠']],
  cuando:[['en la mañana','🌅'],['después de comer','🍽️'],['todos los días','🗓️']],
  porque:[['porque está feliz','😄'],['porque quiere la pelota','⚽'],['porque tiene mucha energía','⚡']]},
 {e:'👧',base:'La niña come',
  donde:[['en la cocina','🍳'],['en el colegio','🏫'],['en la plaza','🛝']],
  cuando:[['en el almuerzo','🕛'],['en la once','☕'],['después del recreo','🔔']],
  porque:[['porque tiene hambre','😋'],['porque la comida está rica','🤤'],['porque jugó mucho','⚽']]},
 {e:'🐱',base:'El gato duerme',
  donde:[['en la cama','🛏️'],['en el sillón','🛋️'],['al lado de la ventana','🪟']],
  cuando:[['en la tarde','🌇'],['después de comer','🍽️'],['cuando llueve','🌧️']],
  porque:[['porque está cansado','🥱'],['porque hace calor','☀️'],['porque es su hora de siesta','⏰']]},
 {e:'👦',base:'El niño juega',
  donde:[['en el patio','🌳'],['en su pieza','🛏️'],['en la plaza','🛝']],
  cuando:[['en el recreo','🔔'],['después del colegio','🏫'],['el fin de semana','🎉']],
  porque:[['porque es divertido','🤩'],['porque terminó sus tareas','✅'],['porque llegó su amigo','🧒']]},
 {e:'👩',base:'Mi mamá cocina',
  donde:[['en la cocina','🍳'],['en la casa de mi abuela','🏡'],['en el patio','🌳']],
  cuando:[['en la noche','🌙'],['el domingo','🗓️'],['para mi cumpleaños','🎂']],
  porque:[['porque tenemos hambre','😋'],['porque vienen visitas','👨‍👩‍👧'],['porque le gusta cocinar','💛']]},
 {e:'🙋',base:'Yo dibujo',
  donde:[['en mi cuaderno','📒'],['en la mesa','🪑'],['en la sala de clases','🏫']],
  cuando:[['después de almorzar','🍽️'],['cuando llueve','🌧️'],['en la tarde','🌇']],
  porque:[['porque me gusta mucho','💛'],['porque quiero regalarlo','🎁'],['porque estoy tranquilo','😌']]},
 {e:'🐦',base:'El pájaro canta',
  donde:[['en el árbol','🌳'],['en la ventana','🪟'],['en el techo','🏠']],
  cuando:[['en la mañana','🌅'],['cuando sale el sol','☀️'],['en primavera','🌸']],
  porque:[['porque está contento','😄'],['porque llama a sus amigos','🐤'],['porque encontró comida','🌾']]},
 {e:'👨',base:'Mi papá maneja',
  donde:[['por la carretera','🛣️'],['al trabajo','🏢'],['hacia la playa','🏖️']],
  cuando:[['en la mañana','🌅'],['el sábado','🗓️'],['en vacaciones','🏝️']],
  porque:[['porque vamos de paseo','🎒'],['porque tiene que trabajar','💼'],['porque vamos a ver a la abuela','👵']]},
];

const STORIES=[
 {title:'Plantar una flor',s:[['🌱','pongo la semilla en la tierra'],['💧','la riego con agua'],['☀️','el sol la calienta'],['🌻','crece una flor muy linda']]},
 {title:'Hacer un sándwich',s:[['🍞','saco dos panes'],['🧀','pongo queso y jamón'],['🥪','cierro el sándwich'],['😋','me lo como todo']]},
 {title:'Ir a la playa',s:[['🎒','preparo mi mochila'],['🚗','vamos en auto'],['🏖️','juego en la arena'],['🌊','me baño en el mar']]},
 {title:'El cumpleaños',s:[['🎈','decoramos con globos'],['🎂','llega la torta'],['🕯️','soplo las velas'],['🎁','abro los regalos']]},
 {title:'Un día de lluvia',s:[['☁️','el cielo se pone gris'],['🌧️','empieza a llover'],['☂️','abro mi paraguas'],['🌈','sale un arcoíris']]},
 {title:'Lavarse los dientes',s:[['🪥','tomo el cepillo'],['🧴','le pongo pasta'],['😁','me lavo los dientes'],['🚰','me enjuago con agua']]},
];
const CONNECT={2:['Primero','Al final'],3:['Primero','Después','Al final'],4:['Primero','Después','Luego','Al final']};
const PICK={2:[0,3],3:[0,1,3],4:[0,1,2,3]};

const TALK=[
 {q:'¿Qué te gusta comer?',start:'Me gusta comer',opts:[['pizza','🍕'],['fideos','🍝'],['empanadas','🥟'],['helado','🍦'],['fruta','🍎'],['completos','🌭']],
  f:[{q:'¿Por qué te gusta?',start:'porque',join:' ',opts:[['es muy rico','🤤'],['es dulce','🍬'],['me da energía','⚡'],['lo prepara mi mamá','👩']]},
     {q:'¿Cuándo lo comes?',start:'lo como',join:' y ',opts:[['en el almuerzo','🕛'],['los fines de semana','🎉'],['en mi cumpleaños','🎂'],['en la once','☕']]}],
  back:'¿Y a ti qué te gusta comer?',reply:'¡A mí me gustan las palabras! Pero si pudiera comer, elegiría un helado de chocolate, porque es dulce y frío.'},
 {q:'¿A qué te gusta jugar?',start:'Me gusta jugar',opts:[['a la pelota','⚽'],['con legos','🧱'],['videojuegos','🎮'],['a las escondidas','🙈'],['con autitos','🚗'],['a dibujar','✏️']],
  f:[{q:'¿Con quién juegas?',start:'con',join:' ',opts:[['mi hermano','👦'],['mis amigos','🧒'],['mi papá','👨'],['mi mamá','👩']]},
     {q:'¿Dónde juegas?',start:'juego',join:' y ',opts:[['en la casa','🏠'],['en el colegio','🏫'],['en la plaza','🛝'],['en el patio','🌳']]}],
  back:'¿Y a ti a qué te gusta jugar?',reply:'A mí me gusta jugar a las adivinanzas, porque me hacen pensar y me río mucho.'},
 {q:'¿Cómo te sientes hoy?',start:'Hoy me siento',opts:[['feliz','😄'],['tranquilo','😌'],['cansado','🥱'],['enojado','😠'],['triste','😢'],['nervioso','😬']],
  f:[{q:'¿Por qué te sientes así?',start:'porque',join:' ',opts:[['dormí bien','😴'],['jugué mucho','⚽'],['pasó algo en el colegio','🏫'],['quiero estar en mi casa','🏠']]},
     {q:'¿Qué te ayuda a sentirte mejor?',start:'me ayuda',join:' y ',opts:[['un abrazo','🤗'],['escuchar música','🎵'],['descansar','🛋️'],['conversar con alguien','💬']]}],
  back:'¿Y tú cómo te sientes hoy?',reply:'Yo me siento contenta, porque estoy conversando contigo.'},
 {q:'¿Qué animal te gusta más?',start:'Mi animal favorito es',opts:[['el perro','🐶'],['el gato','🐱'],['el dinosaurio','🦖'],['el delfín','🐬'],['el león','🦁'],['el caballo','🐴']],
  f:[{q:'¿Cómo es ese animal?',start:'porque es',join:' ',opts:[['muy grande','🐘'],['rápido','💨'],['suave','☁️'],['fuerte','💪'],['divertido','🤩']]},
     {q:'¿Qué le gusta hacer?',start:'le gusta',join:' y ',opts:[['correr','🏃'],['nadar','🏊'],['dormir','😴'],['comer mucho','🍖'],['jugar','🎾']]}],
  back:'¿Y a ti qué animal te gusta?',reply:'Mi animal favorito es la lechuza, porque es tranquila y ve muy bien en la noche.'},
 {q:'¿Qué hiciste hoy?',start:'Hoy',opts:[['fui al colegio','🏫'],['jugué en la casa','🎲'],['vi tele','📺'],['salí a pasear','🚶'],['dibujé','✏️'],['fui a terapia','🗣️']],
  f:[{q:'¿Con quién estabas?',start:'con',join:' ',opts:[['mi mamá','👩'],['mi papá','👨'],['mis compañeros','🧒'],['mi hermano','👦']]},
     {q:'¿Y qué hiciste después?',start:'después',join:' y ',opts:[['comí','🍽️'],['me bañé','🛁'],['hice tareas','📒'],['descansé','🛋️']]}],
  back:'¿Y tú qué hiciste hoy?',reply:'Hoy conversé con muchos niños y aprendí palabras nuevas.'},
];

/* ============ ESTADO ============ */
const KEY='hablemos_v1';
let S={name:'',age:null,lvl:null,rate:0.9,voz:'mujer',mic:true,sound:true,anim:true,stars:0,longest:0,lastPhrase:''};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d) S={...S,...d};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const L=()=>LEVELS[S.lvl!=null?S.lvl:levelFromAge(S.age||9)];
let view=S.age?'home':'setup';
let P=[],cat='per'; // comunicador
let E=null,T=null,C=null;
let setupAge=S.age||null;

/* ============ VOZ Y SONIDO ============ */
let actx=null;
let voice=null,sysOK=false,meReady=false,meLoading=false,pending=null,curSrc=null;
const SYS=(()=>{try{return ('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined'?window.speechSynthesis:null}catch(e){return null}})();
function pickVoice(){try{if(!SYS)return;const vs=SYS.getVoices()||[];const pref=['es-CL','es-419','es-US','es-MX','es-AR','es-ES'];voice=null;
  for(const p of pref){const v=vs.find(v=>v.lang.replace('_','-').toLowerCase()===p.toLowerCase());if(v){voice=v;break}}
  if(!voice)voice=vs.find(v=>v.lang.toLowerCase().startsWith('es'))||null;sysOK=!!voice;}catch(e){sysOK=false}}
if(SYS){try{pickVoice();SYS.onvoiceschanged=pickVoice;}catch(e){}}
const PACK={mujer:'voz-mujer.js',hombre:'voz-hombre.js',nino:'voz-nino.js'};
const VOICES=[['mujer','👩','Mujer'],['hombre','👨','Hombre'],['nino','🧒','Niño/a'],['robot','🤖','Robot'],['sistema','📱','Voz del teléfono']];
const kz=t=>t.toLowerCase().replace(/[¿?¡!.,:]/g,' ').replace(/\s+/g,' ').trim();
const decoded={},packWait={};let curSrcs=[],playToken=0;
function loadPack(v,cb){if(window.VOZ&&window.VOZ[v]){cb&&cb();return}if(packWait[v]){packWait[v].push(cb);return}packWait[v]=[cb];
  const sc=document.createElement('script');sc.src=PACK[v];sc.onload=()=>{const l=packWait[v]||[];packWait[v]=null;l.forEach(f=>f&&f())};sc.onerror=()=>{packWait[v]=null};document.head.appendChild(sc);}
function loadMe(cb){if(meReady){cb&&cb();return}if(cb)pending=cb;if(meLoading)return;meLoading=true;const sc=document.createElement('script');sc.src='voz.js';
  sc.onload=()=>{meReady=!!window.meSpeak;meLoading=false;if(pending){const f=pending;pending=null;f()}};sc.onerror=()=>{meLoading=false};document.head.appendChild(sc);}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx}
function stopSpeech(){playToken++;try{if(SYS)SYS.cancel()}catch(e){}curSrcs.forEach(x=>{try{x.stop()}catch(e){}});curSrcs=[];}
function b64AB(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function getBuf(v,k){const id=v+'|'+k;if(decoded[id])return Promise.resolve(decoded[id]);const b=window.VOZ[v][k];
  return new Promise((res,rej)=>{try{audio().decodeAudioData(b64AB(b),ab=>{decoded[id]=ab;res(ab)},rej)}catch(e){rej(e)}})}
function playSeq(items,tok){if(tok!==playToken)return;const ctx=audio();let t=ctx.currentTime+0.04;const r=1+(S.rate-0.9)*0.6;
  items.forEach(it=>{if(it==='|'){t+=0.7;return}const s=ctx.createBufferSource();s.buffer=it;s.playbackRate.value=r;s.connect(ctx.destination);s.start(t);curSrcs.push(s);t+=it.duration/r+0.07});}
function robot(full,tok){const run=()=>{if(tok!==playToken)return;try{const buf=window.meSpeak.speak(full,{rawdata:'arraybuffer',speed:Math.round(165*S.rate),pitch:55,wordgap:1});const ctx=audio();if(!ctx||!buf)return;
    ctx.decodeAudioData(buf.slice?buf.slice(0):buf,ab=>playSeq([ab],tok),()=>{});}catch(e){}};meReady?run():loadMe(run);}
function speak(parts,vz){if(!Array.isArray(parts))parts=[parts];parts=parts.filter(Boolean);stopSpeech();const tok=playToken;const v=vz||S.voz||'mujer';
  const full=parts.filter(x=>x!=='|').join('. ');
  if(v==='sistema'&&SYS&&sysOK){try{const u=new SpeechSynthesisUtterance(full);u.lang=voice.lang;u.voice=voice;u.rate=S.rate;setTimeout(()=>{try{SYS.speak(u)}catch(e){}},30);return}catch(e){}}
  if(PACK[v]){loadPack(v,()=>{if(tok!==playToken)return;const keys=parts.map(x=>x==='|'?'|':kz(x));
      if(!keys.every(k=>k==='|'||window.VOZ[v][k]))return robot(full,tok);
      Promise.all(keys.map(k=>k==='|'?'|':getBuf(v,k))).then(b=>playSeq(b,tok)).catch(()=>robot(full,tok));});return}
  robot(full,tok);}
function chime(){if(!S.sound)return;try{audio();if(!actx)return;
  [523.25,659.25,783.99].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
  const t=actx.currentTime+i*0.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.55);});}catch(e){}}

const PRAISE=['¡Muy bien','¡Excelente','¡Bacán','¡Lo hiciste genial','¡Increíble'];
function reward(n,msg){S.stars+=n;save();chime();
  const nm=S.name?', '+S.name:'';const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const el=document.createElement('div');el.className='toast'+(S.anim?' pop':'');el.innerHTML=`<span class="e">⭐</span>${p}${esc(nm)}!<div style="font-size:17px;color:var(--muted);margin-top:4px">${esc(msg||'')}</div>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1700);render();}

/* ============ MICRÓFONO ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let rec=null,listening=false,micBlocked=false,M={key:''};
const MICCFG={
 exp:{parts:()=>expParts(),ok:0.85,good:0.6,stars:1},
 talk:{parts:()=>talkParts(),ok:0.85,good:0.6,stars:1},
 story:{parts:()=>storyParts(),ok:0.7,good:0.45,stars:2},
 com:{parts:()=>P.map(x=>x.t),ok:0.85,good:0.6,stars:1},
};
const micOn=()=>!!SR&&S.mic!==false;
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;let d=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let prev=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return d[n]}
function targetToks(ctx){const out=[];MICCFG[ctx].parts().join(' ').split(/\s+/).forEach(w=>{const n=norm(w);if(n)n.split(' ').forEach(x=>out.push({w:n===x?w:x,n:x}))});return out}
function matchAlt(toks,alt){const hw=norm(alt).split(' ').filter(Boolean);const used=new Set();
  const flags=toks.map(t=>{for(let j=0;j<hw.length;j++){if(used.has(j))continue;const h=hw[j];
    if(h===t.n||(t.n.length>=4&&lev(t.n,h)<=1)||(t.n.length>=6&&lev(t.n,h)<=2)||(t.n.length>=5&&h.length>=4&&h.slice(0,4)===t.n.slice(0,4))){used.add(j);return true}}return false});
  return {flags,score:toks.length?flags.filter(Boolean).length/toks.length:0,text:alt}}
function micPanel(ctx){const toks=targetToks(ctx);const key=ctx+'|'+toks.map(t=>t.n).join(' ');
  if(M.key!==key)M={key,ctx,attempts:0,flags:null,heard:'',msg:'',done:false};
  let h='';
  if(M.flags)h+=`<div class="chips" style="min-height:0;margin:6px 0">${toks.map((t,i)=>`<span class="wchip ${M.flags[i]?'hit':'miss'}">${esc(t.w)}</span>`).join('')}</div>`;
  if(M.msg)h+=`<p class="micmsg">${M.msg}</p>`;
  h+=`<p class="hint" id="heard">${M.heard?'Te escuché: “'+esc(M.heard)+'”':''}</p>`;
  if(micOn()&&!micBlocked&&!M.done)h+=`<button class="btn mic ${listening?'on':''}" data-a="mic" data-v="${ctx}">${listening?'👂 Te estoy escuchando… (toca al terminar)':(M.attempts?'🎤 Intentar otra vez':'🎤 ¡Dilo tú!')}</button>`;
  if(SR&&S.mic!==false&&micBlocked)h+=`<p class="hint">🎤 El micrófono no está disponible en esta vista. Para usarlo, abre la app desde su enlace propio en Chrome o Safari y acepta el permiso del micrófono.</p>`;
  return h}
function startListen(ctx){if(listening){try{rec&&rec.stop()}catch(e){}return}
  stopSpeech();let r;try{r=new SR()}catch(e){micBlocked=true;render();return}
  rec=r;r.lang='es-CL';r.interimResults=true;r.maxAlternatives=4;r.continuous=false;let alts=[];listening=true;M.heard='';render();
  r.onresult=e=>{let base='';for(let i=0;i<e.results.length;i++)base+=(i?' ':'')+e.results[i][0].transcript;
    const last=e.results[e.results.length-1];const pre=base.slice(0,base.length-last[0].transcript.length);alts=[base];
    for(let j=1;j<last.length;j++)alts.push(pre+last[j].transcript);M.heard=base;const el=document.getElementById('heard');if(el)el.textContent='Te escuché: “'+base+'”';};
  r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))micBlocked=true};
  r.onend=()=>{if(rec!==r)return;listening=false;rec=null;if(micBlocked){render();return}evaluate(ctx,alts)};
  try{r.start()}catch(e){listening=false;rec=null;micBlocked=true;render();return}
  setTimeout(()=>{if(rec===r)try{r.stop()}catch(e){}},15000);}
function evaluate(ctx,alts){const cfg=MICCFG[ctx];const toks=targetToks(ctx);const parts=cfg.parts();
  alts=alts.filter(a=>a&&a.trim());
  if(!alts.length){M.msg='No te escuché bien. Toca el micrófono y dilo otra vez 🙂';speak('No te escuché bien, intentemos de nuevo');render();return}
  const best=alts.map(a=>matchAlt(toks,a)).sort((a,b)=>b.score-a.score)[0];M.flags=best.flags;M.heard=best.text;M.attempts++;
  if(best.score>=cfg.ok){M.done=true;M.msg='¡Lo dijiste completo! 🌟';speak([rnd(['¡Excelente!','¡Muy bien!','¡Bacán!']),'|',...parts]);done(ctx,cfg.stars,'¡Lo dijiste completo!')}
  else if(best.score>=cfg.good){M.done=true;M.msg='¡Muy bien! Así suena completa: 💛';speak(['¡Sí!',...parts]);done(ctx,cfg.stars,'¡Muy bien dicho!')}
  else if(M.attempts<2){M.msg='¡Buen intento! Escucha y probemos otra vez 💛';speak(['¡Buen intento!','Escucha:',...parts,'|','¿Lo intentamos otra vez?']);render()}
  else{M.done=true;M.msg='¡Buen intento! Lo importante es practicar 💛';speak(['¡Buen intento!','Escucha:',...parts]);done(ctx,1,'¡Gracias por intentarlo!')}}
function done(ctx,n,msg){if(ctx==='talk')C.said=true;setTimeout(()=>reward(n,msg),300);render()}
const NEXT={exp:['expnext','➡ Otra frase'],talk:['talknext','➡ Otro tema'],story:['storynext','➡ Otra historia'],com:['clear','🗑️ Armar otra frase']};

/* ============ NUEVAS RONDAS ============ */
function newExp(){let it;do{it=rnd(EXP)}while(E&&EXP.length>1&&it===E.item);E={item:it,step:0,chosen:[]};}
function newStory(){let st;do{st=rnd(STORIES)}while(T&&STORIES.length>1&&st.title===T.title);const n=L().scenes;const sc=PICK[n].map(i=>st.s[i]);
  let order;do{order=shuffle(sc.map((_,i)=>i))}while(order.every((v,i)=>v===i));T={title:st.title,n,sc,order,placed:[]};}
function newTalk(){let tp;do{tp=rnd(TALK)}while(C&&TALK.length>1&&tp===C.topic);C={topic:tp,parts:[],said:false,backDone:false};}

/* ============ RENDER ============ */
function render(){const app=document.getElementById('app');document.body.classList.toggle('noanim',!S.anim);
 app.innerHTML=view==='setup'?vSetup():view==='com'?vCom():view==='exp'?vExp():view==='story'?vStory():view==='talk'?vTalk():vHome();}

/* ============ ACCIONES ============ */
const A={
 mic(v){startListen(v)},
 home(){view='home';stopSpeech();if(rec){try{rec.abort()}catch(e){}rec=null;listening=false}render();window.scrollTo(0,0)},
 setage(v){setupAge=+v;S.name=document.getElementById('nm').value.trim();render()},
 finishsetup(){S.name=document.getElementById('nm').value.trim();if(!setupAge){const b=document.querySelector('.ages');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
   S.age=setupAge;save();view='home';render();speak(['Hola','¡Vamos a jugar con las palabras!'])},
 go(v){view=v;if(v==='exp'){newExp();setTimeout(()=>speak(E.item.base),50)}if(v==='story')newStory();if(v==='talk'){newTalk();setTimeout(()=>speak(C.topic.q),50)}render();window.scrollTo(0,0)},
 cat(v){cat=v;render()},
 word(v){const w=CATS.find(c=>c.id===cat).w[+v];P.push({t:w[0],e:w[1],c:cat});speak(w[0]);render()},
 undo(){P.pop();render()},
 clear(){P=[];render()},
 sayphrase(){if(!P.length)return;let txt=cap(P.map(x=>x.t).join(' '));speak(P.map(x=>x.t));const n=words(txt);
   if(n>S.longest){S.longest=n;save()}
   if(n>=L().target&&txt!==S.lastPhrase){S.lastPhrase=txt;save();setTimeout(()=>reward(1,'¡Qué frase más completa!'),900)}},
 expopt(v){const k=expSteps()[E.step];E.chosen.push(E.item[k][+v]);E.step++;speak(expParts());render()},
 expsay(){speak(expParts())},
 expok(){const m='Dijiste una frase de '+words(expText())+' palabras';newExp();reward(1,m);setTimeout(()=>speak(E.item.base),1800);},
 expnext(){newExp();render();speak(E.item.base)},
 storypick(v){v=+v;const need=T.placed.length;
   if(v===need){T.placed.push(v);speak(`${CONNECT[T.n][need]} ${T.sc[v][1]}.`);render();if(T.placed.length===T.n)setTimeout(()=>speak(storyParts()),1900)}
   else{const b=document.querySelector(`[data-a="storypick"][data-v="${v}"]`);if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}speak('Mmm, ¿qué pasa antes?')}},
 storysay(){speak(storyParts())},
 storyok(){newStory();reward(2,'¡Contaste toda la historia!');},
 storynext(){newStory();render()},
 talkopt(v){const st=C.parts.length;const cur=st===0?{start:C.topic.start,opts:C.topic.opts}:C.topic.f[st-1];C.parts.push(cur.start+' '+cur.opts[+v][0]);
   const l=L();const maxStage=1+Math.min(l.follows,C.topic.f.length);render();
   if(C.parts.length<maxStage){speak([...talkParts(),'|',C.topic.f[C.parts.length-1].q])}else speak(talkParts())},
 talkrepeat(){const st=C.parts.length;speak(st===0?C.topic.q:C.topic.f[st-1].q)},
 talksay(){speak(talkParts())},
 talkok(){C.said=true;reward(1,'¡Respondiste con '+words(talkAnswer())+' palabras!')},
 talkback(){C.backDone=true;render();speak([C.topic.back,'|',C.topic.reply]);if(!C.backRew){C.backRew=true;setTimeout(()=>reward(1,'¡Hiciste una pregunta!'),400)}},
 talknext(){newTalk();render();window.scrollTo(0,0);speak(C.topic.q)},
 settings(){document.getElementById('layer').innerHTML=vSettings();const r=document.getElementById('s-rate');r.oninput=()=>document.getElementById('rv').textContent=(+r.value).toFixed(1)},
 closeset(){document.getElementById('layer').innerHTML=''},
 saveset(){S.name=document.getElementById('s-nm').value.trim();S.age=+document.getElementById('s-age').value;const lv=document.getElementById('s-lvl').value;S.lvl=lv===''?null:+lv;
   S.rate=+document.getElementById('s-rate').value;S.sound=document.getElementById('s-snd').checked;S.anim=document.getElementById('s-anim').checked;S.mic=document.getElementById('s-mic').checked;save();
   document.getElementById('layer').innerHTML='';if(view==='exp')newExp();if(view==='story')newStory();if(view==='talk')newTalk();render()},
 testvoice(){const old=S.rate;S.rate=+document.getElementById('s-rate').value;speak('Hola, me gusta conversar contigo.');S.rate=old},
 pickvoz(v){S.voz=v;save();document.querySelectorAll('[data-a=pickvoz]').forEach(b=>{const on=b.dataset.v===v;b.style.borderColor=on?'var(--brand)':'';b.style.background=on?'#EAF0FC':''});speak('Hola, me gusta conversar contigo.')},
 resetstars(){S.stars=0;S.longest=0;S.lastPhrase='';save();A.closeset();render()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='closeset'&&e.target.closest('[data-stop]'))return;
  audio();const f=A[b.dataset.a];if(f){try{f(b.dataset.v)}catch(err){console.error(err);try{render()}catch(e2){}}}});
render();
if(!S.voz)S.voz='mujer';
setTimeout(()=>{pickVoice();if(PACK[S.voz])loadPack(S.voz)},300);
</script>
